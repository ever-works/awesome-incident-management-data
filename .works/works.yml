company_name: Awesome Incident Management
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome Incident Management
initial_prompt: |-
  A curated directory of incident response, on-call scheduling, alerting and postmortem tools. Include products such as PagerDuty, incident.io, Rootly, FireHydrant, Opsgenie, Squadcast, Better Stack, Spike.sh, Zenduty, xMatters, Splunk On-Call, Jira Service Management, plus other notable commercial and open-source options. Categories: Incident Response Platforms, On-Call & Alerting, Status Communication, Postmortems & Retros, Open Source, Slack/Teams-Native Incident Tools. For every item capture the official website, a short factual description, pricing model (free, freemium, paid, open source), deployment (cloud or self-hosted), key features and integrations.

  Initial categories: Incident Response Platforms; On-Call & Alerting; Status Communication; Postmortems & Retros; Open Source; Slack/Teams-Native Incident Tools.
  Target keywords: incident management, on-call scheduling, pagerduty alternatives, incident response software.

  Start with these source lists (use the raw README link for GitHub lists):
  - https://www.softwaresuggest.com/incident-management-software
  - https://www.softwaresuggest.com/it-alerting-software
  - https://raw.githubusercontent.com/KHiis/awesome-incident-management/HEAD/README.md
  - https://github.com/topics/incident-management

  Inclusion rules: every item is a real product, service, open-source project or platform in scope; never a statistic, quote, blog post, person or general concept.
  One item per product. The item URL is the official website (never an affiliate link, review-site page or "top 10" article). Skip discontinued products and sites that no longer resolve.
  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for open source state the license and link the repository.
  Each item gets exactly one primary category from the initial categories; do not create near-duplicate categories.
  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid, Enterprise, API, AI-Powered, plus niche-specific ones.
  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt, SourceForge/Slashdot, There's An AI For That or Toolify as sources.
