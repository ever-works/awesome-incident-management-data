markdown: >-
  ## Overview


  Grafana On-Call is an on-call management tool by Grafana, part of Grafana
  Cloud.


  ## Key Features


  - On-call schedule management

  - Escalation policies and routing

  - Alert centralization for incident response

  - Part of the Grafana Cloud observability stack


  ## Pricing


  Paid commercial service (Grafana Cloud). A free tier of Grafana Cloud is
  available with limited usage.
