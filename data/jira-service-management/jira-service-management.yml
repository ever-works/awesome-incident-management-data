markdown: >-
  ## Overview


  Jira Service Management is a comprehensive help desk incident management
  software that provides support teams with all the information needed to
  successfully respond to internal or external service requests.


  ## Features


  - Prioritize service tickets

  - Self-service tools

  - Subscription-based notifications

  - ITSM collaboration and documentation

  - Automated ticket routing


  ## Pricing


  - Free

  - Standard - $20 per agent per month

  - Premium - $40 per agent per month

  - Enterprise - Contact sales
