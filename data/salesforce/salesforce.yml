markdown: >-
  ## Overview


  Salesforce provides organizations with a way to create and track customer
  support tickets and automatically route and escalate incidents to the
  appropriate responders.


  ## Features


  - Prioritize service tickets

  - Ticket creation and submission

  - ITSM collaboration and documentation

  - Ticket response


  ## Pricing


  Starting at $65/month.
