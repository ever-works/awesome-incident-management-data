name: "Opsgenie"
description: "Opsgenie is an incident and alert management platform by Atlassian for on-call scheduling and alert routing. It consolidates notifications from monitoring systems and escalates them to the right personnel via phone, SMS, and email. A free plan supports up to five users; paid plans add advanced routing and reporting."
